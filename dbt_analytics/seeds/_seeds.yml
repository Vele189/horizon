version: 2

seeds:
  - name: cities
    description: >
      The fifteen target cities, generated from config/cities.yml by
      dbt_analytics/export_cities.py. Never edited by hand; a test asserts it
      matches the YAML, because two copies of the same list is one copy and one
      liability.
    config:
      column_types:
        city_id: text
        name: text
        country: text
        country_code: text
        region: text
        latitude: double precision
        longitude: double precision
        elevation_m: real
        timezone: text
        hemisphere: text
        koppen: text
        season_model: text
        role: text
    columns:
      - name: city_id
        description: '{{ doc("col_city_id") }}'
        tests: [unique, not_null]
      - name: timezone
        description: >
          IANA zone name. Stored so local-time views remain possible
          downstream. Four entries are deliberate traps - Phoenix keeps
          standard time all year on a US longitude, Reykjavik is UTC+0 year
          round, Delhi is UTC+05:30 and breaks integer-hour arithmetic, and
          Sydney and Auckland run daylight saving on the southern calendar.
        tests: [not_null]
      - name: hemisphere
        description: Derived from the latitude, never configured.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['north', 'south']
      - name: name
        description: >
          The city's common English name, for display.
      - name: country
        description: >
          Country name, for display.
      - name: country_code
        description: >
          ISO 3166-1 alpha-2 code.
      - name: region
        description: >
          Continent-level grouping, deliberately coarse - it groups fifteen cities in a dashboard filter rather than encoding geography.
      - name: latitude
        description: >
          The city's reference coordinate - what was asked for, not the grid cell that answered.
      - name: longitude
        description: >
          The city's reference coordinate. See `latitude`.
      - name: elevation_m
        description: >
          The city's own elevation in metres, carried as a model feature. Not the grid cell's.
      - name: koppen
        description: >
          Koppen-Geiger climate classification.
      - name: season_model
        description: '{{ doc("col_season_model") }}'
      - name: role
        description: >
          Why this city is in the set - the analytical job it does. Null where it is simply representative.


  - name: t_critical
    description: >
      Student-t critical values by degrees of freedom, at the two-tailed
      probability of |Z| > 2.5. Generated from `scipy.stats.t` by
      `dbt_analytics/export_t_critical.py`; never edited by hand, and a test
      asserts it matches the generator.


      **Why a table and not a formula.** The anomaly flag divides a departure by
      a sigma that has been *estimated* from a finite window, so the honest
      exceedance test is a t-interval rather than a normal one. Postgres has no
      inverse-t, and the usual closed forms are worst exactly where this matters:
      the Cornish-Fisher expansion is 7% low at fourteen degrees of freedom and
      10% low at four, which is the entire population the correction exists for.
      A generated table is exact, diffs as text, and can be checked against any
      reference; an approximation is a page of magic constants nobody can check
      by reading.


      One to a thousand degrees of freedom. A complete city's baseline is about
      460 observations, so the range covers every baseline this project can
      produce with room for a wider smoothing window; above it
      `fact_weather_anomalies` falls back to the nominal threshold, and a test
      asserts no judged row takes that path.
    config:
      column_types:
        degrees_of_freedom: integer
        z_threshold: double precision
        critical_value: double precision
    columns:
      - name: degrees_of_freedom
        description: >
          Observations behind the baseline, less one for the sigma estimated
          from them.
        tests: [unique, not_null]
      - name: z_threshold
        description: >
          The nominal |Z| this table was generated for. Carried so the file is
          self-describing and a dbt test can refuse a build whose configured
          threshold has drifted away from it.
        tests: [not_null]
      - name: critical_value
        description: >
          The 1 - alpha/2 quantile of the t distribution, where alpha is the
          two-tailed normal probability of the threshold. Converges on the
          threshold itself as the degrees of freedom grow, which is what makes
          this a correction rather than a new definition.
        tests: [not_null]
