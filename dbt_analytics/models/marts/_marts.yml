version: 2

models:
  - name: dim_cities
    description: >
      One row per target city, built from config/cities.yml rather than from
      observation data.


      **These are grid cells, not weather stations.** Open-Meteo serves ERA5
      reanalysis: a physical model reconciled with observations onto a regular
      grid, not readings from an instrument at a named place. The original
      project draft called this table `dim_weather_stations`, and that framing
      would misdescribe the source to anyone who knows the domain: there is no
      station, no instrument history, no siting metadata, and no station
      identifier to join on. A request is snapped to the nearest cell, which is
      why every observation row carries the `api_latitude`, `api_longitude` and
      `api_elevation_m` that actually answered: London's 51.5074/-0.1278 at
      11 m resolves to 51.4938/-0.1630 at 16 m.


      The coordinates here are therefore the city's own reference point, and
      `elevation_m` is the city's elevation rather than the grid cell's. They
      are what was asked for; the fact tables record what replied.


      Built from the registry and not from the facts on purpose. A dimension
      inferred from landed data would list fourteen cities during a backfill
      and would quietly lose one whose ingestion failed.

    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_id]

    columns:
      - name: city_id
        description: '{{ doc("col_city_id") }}'
        tests: [unique, not_null]
      - name: name
        tests: [not_null]
      - name: country
        tests: [not_null]
      - name: region
        description: >
          Continent-level, deliberately coarse - this groups fifteen cities in
          a dashboard filter rather than encoding geography. A finer scheme
          would put most of them in a bucket of one.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Africa', 'Asia', 'Europe', 'North America', 'Oceania',
                         'South America']
      - name: latitude
        description: City-centre reference point, not the grid cell that answered.
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: -90
                max_value: 90
      - name: longitude
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: -180
                max_value: 180
      - name: elevation_m
        description: The city's elevation, not the grid cell's; carried as a model feature.
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: -430
                max_value: 5100
      - name: timezone
        description: IANA zone, so a local-time view is possible downstream.
        tests: [not_null]
      - name: koppen
        description: Köppen-Geiger classification.
        tests: [not_null]
      - name: hemisphere
        description: >
          Derived from the sign of the latitude in SQL, not carried over from
          configuration. The season mapping reads this, so for the five
          southern cities a wrong value inverts summer and winter.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['north', 'south']
      - name: name
        description: >
          The city's common English name, for display.
      - name: country
        description: >
          Country name, for display.
      - name: country_code
        description: >
          ISO 3166-1 alpha-2 code.
      - name: longitude
        description: >
          The city's reference coordinate. See `latitude`.
      - name: season_model
        description: '{{ doc("col_season_model") }}'
      - name: role
        description: >
          Why this city is in the set - the analytical job it does. Null where it is simply representative.

  - name: dim_date
    description: >
      The date spine, one row per calendar day from the backfill's start to a
      year beyond the archive edge.


      Generated rather than derived from the facts. A spine built from what has
      landed would have a hole wherever ingestion does, and a join against it
      would hide the hole rather than reveal it - which is the opposite of what
      a date dimension is for.


      **There is no `season` column, deliberately.** A season is not a property
      of a date: 15 December is summer in Sydney and winter in London, and the
      same row of this table has to serve both. Both four-season answers are
      carried side by side, and `dim_city_season` resolves the right one per
      city including the two tropical regimes.


      **The leap-year trap is why `month_day` exists.** `day_of_year` is 1..366,
      so 1 March is day 60 in a common year and day 61 in a leap year.
      Grouping a thirty-year climatology by `day_of_year` therefore mixes
      1 March with 29 February and shifts every day after February by one in
      three years out of four - a systematic error that reads as a seasonal
      signal. `month_day` is stable across every year and is the join key the
      climatology should use; 29 February then has a quarter of the sample
      size, which is true and worth knowing rather than hidden.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_day]
    columns:
      - name: date_day
        description: The calendar day, and the grain of this table.
        tests: [unique, not_null]
      - name: day_of_year
        description: Raw 1..366. Do not group a climatology by this - see the model description.
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 1, max_value: 366}
      - name: day_of_year_common
        description: >
          Day of year as if every year were common, for anything needing a
          contiguous numeric axis. 29 February shares day 59 with 28 February,
          so nothing after it shifts.
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 1, max_value: 365}
      - name: month_day
        description: MM-DD. The stable climatology join key.
        tests: [not_null]
      - name: month
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 1, max_value: 12}
      - name: season_northern
        description: Meteorological season for a northern city. Not "the" season.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['winter', 'spring', 'summer', 'autumn']
      - name: season_southern
        description: The same months six away. December is summer here.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['winter', 'spring', 'summer', 'autumn']
      - name: is_leap_day
        tests: [not_null]
      - name: is_leap_year
        tests: [not_null]
      - name: year
        description: >
          Calendar year of the observation, in UTC.
      - name: quarter
        description: >
          Calendar quarter, 1-4.
      - name: month
        description: >
          Calendar month, 1-12.
      - name: day_of_month
        description: >
          Day within the month, 1-31.
      - name: month_name
        description: >
          Month name, padded by `to_char`. For display only.
      - name: day_name
        description: >
          Weekday name, padded by `to_char`. For display only.
      - name: iso_day_of_week
        description: >
          ISO weekday, 1 (Monday) to 7 (Sunday).
      - name: iso_week
        description: >
          ISO week number.
      - name: iso_year
        description: >
          ISO week-numbering year, which differs from the calendar year across a year boundary.
      - name: is_weekend
        description: >
          Saturday or Sunday. Present for completeness; weather does not observe it.
      - name: is_leap_day
        description: >
          Whether this row is 29 February.
      - name: is_leap_year
        description: >
          Whether the calendar year has 366 days.
      - name: climatology_day
        description: >
          Day-of-year as it would be in a leap year, 1-366. The circular axis the climatology window is measured on.

  - name: dim_city_season
    description: >
      Which season a given month is, for a given city - the join dim_date
      cannot make on its own.


      Season depends on the city's hemisphere and on its season regime, so one
      row of dim_date has a different answer for Sydney than for London.
      Fifteen cities by twelve months is 180 rows, so this is a lookup rather
      than a bridge over the whole spine.


      Tropical cities are not forced into four seasons. Lagos, a tropical
      monsoon climate with no thermal season worth the name, gets `wet` and
      `dry`. Singapore, within 1.4 degrees of the equator with neither a
      thermal cycle nor a dry season, gets `year_round` - which says there is
      no season rather than inventing one. Calling a Lagos December "winter"
      would describe nothing and would pull it into a northern-winter cohort
      in every seasonal aggregate.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_id, month]
    columns:
      - name: city_id
        description: '{{ doc("col_city_id") }}'
        tests: [not_null]
      - name: month
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 1, max_value: 12}
      - name: season
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['winter', 'spring', 'summer', 'autumn', 'wet', 'dry',
                         'year_round']
      - name: season_model
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['four_season', 'wet_dry', 'seasonless']
      - name: city_id
        description: '{{ doc("col_city_id") }}'
      - name: month
        description: >
          Calendar month, 1-12.
      - name: hemisphere
        description: '{{ doc("col_hemisphere") }}'
      - name: season_model
        description: '{{ doc("col_season_model") }}'
      - name: season
        description: >
          The season this month falls in for this city, resolved against its hemisphere and regime.

  - name: fact_weather_observations
    description: >
      The primary daily fact: one row per city per UTC day, with foreign keys
      to dim_cities and dim_date.


      Selected from silver rather than joined to the dimensions. An inner join
      to dim_cities would enforce referential integrity by *dropping* any row
      it could not match, which is the wrong failure - a fact silently missing
      a city looks exactly like a city with no weather. The relationships tests
      below assert the same property and fail loudly instead.


      Silver has already deduplicated on (city_id, observation_time) and
      asserted units, so the grain here is inherited rather than re-derived.
      The unique test on (city_id, date_key) is what proves that inheritance
      held.


      Materialised as a table with a unique index on (city_id, date_key) and a
      second on date_key alone - the dashboard filters by city and scans by
      date, and gold is what it reads over a serverless connection.


      **Expected size** is 15 cities x 11,568 days = 173,520 rows once the
      backfill completes (the proposal's ~164,000 assumed a round 30 years;
      the range runs 1995-01-01 to the archive edge). It holds fewer while the
      backfill is in progress, and the count is asserted against silver rather
      than against a constant so it stays true either way.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_id, date_key]
    columns:
      - name: city_id
        description: '{{ doc("col_city_id") }}'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cities')
                field: city_id
      - name: date_key
        description: >
          Foreign key to dim_date, and the grain. The UTC calendar day the
          aggregate covers - a projection of a day that is already a UTC day
          upstream, not a timezone conversion.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: observation_time
        description: >
          The exact instant, carried alongside the key so a mart row can join
          back to silver without reconstructing a midnight - and so there is a
          timestamp here that says which zone it is in, which the date does not.
        tests: [not_null]
      - name: temperature_2m_min
        tests:
          - accepted_range:
              arguments: {min_value: -90, max_value: 60}
      - name: temperature_2m_max
        tests:
          - accepted_range:
              arguments: {min_value: -90, max_value: 60}
      - name: temperature_2m_mean
        tests:
          - accepted_range:
              arguments: {min_value: -90, max_value: 60}
      - name: precipitation_sum
        tests:
          - accepted_range:
              arguments: {min_value: 0}
      - name: wind_speed_10m_max
        description: km/h, bounded in m/s through the kmh_to_ms macro.
        tests:
          - accepted_range:
              arguments:
                expression: "{{ kmh_to_ms('wind_speed_10m_max') }}"
                min_value: 0
                max_value: 120
      - name: wind_gusts_10m_max
        tests:
          - accepted_range:
              arguments:
                expression: "{{ kmh_to_ms('wind_gusts_10m_max') }}"
                min_value: 0
                max_value: 120
      - name: pressure_msl_mean
        tests:
          - accepted_range:
              arguments: {min_value: 850, max_value: 1085}
      - name: surface_pressure_mean
        description: At the grid cell's elevation, not reduced to sea level.
        tests:
          - accepted_range:
              arguments: {min_value: 700, max_value: 1085}
      - name: relative_humidity_2m_mean
        tests:
          - accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: batch_id
        description: The ingestion run that produced the underlying row.
        tests: [not_null]
      - name: api_latitude
        description: '{{ doc("col_api_latitude") }}'
      - name: api_longitude
        description: '{{ doc("col_api_longitude") }}'
      - name: api_elevation_m
        description: '{{ doc("col_api_elevation_m") }}'
      - name: temperature_2m_min
        description: '{{ doc("col_temperature_2m_min") }}'
      - name: temperature_2m_max
        description: '{{ doc("col_temperature_2m_max") }}'
      - name: temperature_2m_mean
        description: '{{ doc("col_temperature_2m_mean") }}'
      - name: apparent_temperature_min
        description: '{{ doc("col_apparent_temperature") }}'
      - name: apparent_temperature_max
        description: '{{ doc("col_apparent_temperature") }}'
      - name: apparent_temperature_mean
        description: '{{ doc("col_apparent_temperature") }}'
      - name: dew_point_2m_mean
        description: '{{ doc("col_dew_point") }}'
      - name: precipitation_sum
        description: '{{ doc("col_precipitation") }}'
      - name: rain_sum
        description: >
          Liquid precipitation, mm. A component of `precipitation_sum` and never larger than it.
      - name: snowfall_sum
        description: >
          Snowfall, **centimetres** - unlike every other depth in the row, which is millimetres. See `snowfall_sum_mm`.
      - name: snowfall_sum_mm
        description: >
          Snowfall in millimetres, so it is comparable with `precipitation_sum` and `rain_sum` without anyone having to remember the source's inconsistency.
      - name: precipitation_hours
        description: >
          Hours of the day with measurable precipitation, 0-24.
      - name: wind_speed_10m_mean
        description: '{{ doc("col_wind_speed") }}'
      - name: wind_gusts_10m_max
        description: '{{ doc("col_wind_gusts") }}'
      - name: wind_direction_10m_dominant
        description: '{{ doc("col_wind_direction") }}'
      - name: pressure_msl_mean
        description: '{{ doc("col_pressure_msl") }}'
      - name: relative_humidity_2m_mean
        description: '{{ doc("col_relative_humidity") }}'
      - name: cloud_cover_mean
        description: '{{ doc("col_cloud_cover") }}'
      - name: shortwave_radiation_sum
        description: >
          Downward shortwave radiation, MJ/m^2 - not W/m^2.
      - name: weather_code
        description: '{{ doc("col_weather_code") }}'
      - name: ingested_at
        description: '{{ doc("col_ingested_at") }}'

  - name: fact_weather_hourly
    description: >
      Hourly facts for the trailing 24 months, feeding the Storm Dynamics view
      and nothing else.


      Thirty years at this grain would be over four million rows for no
      analytical benefit - the storm view reads a rolling window and the
      climatology is built from the daily grain - and it would be the single
      largest object the pipeline produces, which matters because gold is the
      only layer promoted to Neon's 0.5 GB allowance.


      **The window is derived from the data, not pinned.** Silver holds
      whatever ingestion landed, and two cities carry an extra eight months
      from an earlier archival sample that took a calendar year rather than the
      anchored window. Without the filter those rows would sit in a table that
      claims to cover 24 months; with it, silver's 274,920 rows become 263,160
      here.


      **Pressure tendency uses a RANGE frame, not `lag(n)`.** `lag(pressure, 3)`
      counts rows, so one missing hour makes it reach four hours back and
      report the result as a three-hour change - a fabricated storm signal from
      data that merely had a hole. RANGE asks for the reading exactly three
      hours earlier and returns null when there is not one. Silver has no gaps
      today; the correct form costs nothing and stays correct if it ever does.


      Sanity-checked against real weather: the six deepest 24-hour falls in the
      table are all Reykjavik, on the North Atlantic storm track, reaching
      -41 hPa against the ~-24 hPa that defines explosive cyclogenesis, with
      sea-level pressure down to 949.6 hPa.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_id, observation_hour]
    columns:
      - name: city_id
        description: '{{ doc("col_city_id") }}'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cities')
                field: city_id
      - name: observation_hour
        description: Top of the hour, UTC. The grain.
        tests: [not_null]
      - name: date_key
        description: Foreign key to dim_date, for joining the hourly view to calendar attributes.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: pressure_msl
        description: >
          Sea-level pressure, which is what tendency is computed on. Surface
          pressure carries the grid cell's elevation, so a tendency on it would
          compare Johannesburg's 822 hPa against London's 1013 the moment
          anything aggregated across cities.
        tests:
          - accepted_range:
              arguments: {min_value: 850, max_value: 1085}
      - name: pressure_tendency_3h
        description: >
          Change in sea-level pressure over three hours, hPa. The synoptic
          standard. Null for the first three hours of each city's series.
        tests:
          - accepted_range:
              arguments: {min_value: -60, max_value: 60}
      - name: pressure_tendency_24h
        description: >
          Change over 24 hours, hPa. A fall of roughly 24 hPa in 24 hours at
          mid-latitudes is the definition of a "bomb cyclone". Null for the
          first 24 hours of each city's series.
        tests:
          - accepted_range:
              arguments: {min_value: -120, max_value: 120}
      - name: wind_gusts_10m
        tests:
          - accepted_range:
              arguments:
                expression: "{{ kmh_to_ms('wind_gusts_10m') }}"
                min_value: 0
                max_value: 120
      - name: temperature_2m
        tests:
          - accepted_range:
              arguments: {min_value: -90, max_value: 60}
      - name: relative_humidity_2m
        tests:
          - accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: city_id
        description: '{{ doc("col_city_id") }}'
      - name: api_latitude
        description: '{{ doc("col_api_latitude") }}'
      - name: api_longitude
        description: '{{ doc("col_api_longitude") }}'
      - name: api_elevation_m
        description: '{{ doc("col_api_elevation_m") }}'
      - name: surface_pressure
        description: '{{ doc("col_surface_pressure") }}'
      - name: wind_speed_10m
        description: '{{ doc("col_wind_speed") }}'
      - name: wind_gusts_10m
        description: '{{ doc("col_wind_gusts") }}'
      - name: wind_direction_10m
        description: '{{ doc("col_wind_direction") }}'
      - name: temperature_2m
        description: '{{ doc("col_temperature_2m_mean") }}'
      - name: apparent_temperature
        description: '{{ doc("col_apparent_temperature") }}'
      - name: dew_point_2m
        description: '{{ doc("col_dew_point") }}'
      - name: relative_humidity_2m
        description: '{{ doc("col_relative_humidity") }}'
      - name: precipitation
        description: '{{ doc("col_precipitation") }}'
      - name: cloud_cover
        description: '{{ doc("col_cloud_cover") }}'
      - name: weather_code
        description: '{{ doc("col_weather_code") }}'
      - name: ingested_at
        description: '{{ doc("col_ingested_at") }}'
      - name: batch_id
        description: '{{ doc("col_batch_id") }}'

  - name: fact_climatology
    description: >
      The day-of-year climatology: mean and standard deviation of daily
      temperature per city per calendar day, smoothed over a +/-7 day window,
      and computed **excluding the year being labelled**.


      **Why the exclusion is the point.** A normal computed over all years
      includes the very day it is about to label. The observation contributes
      to its own mean and inflates its own sigma by its own deviation, so the
      resulting Z-score is systematically too small, extremes look less
      extreme, and a model trained on those labels is scoring against a target
      that has already seen its own answer. With ~30 reference years the
      leakage is roughly 1/30 of the signal - small enough to pass a spot
      check, large enough to change a ranking. It is a parameter
      (`climatology_exclude_own_year`, default true) so the leaky variant can
      be built deliberately for comparison rather than reached by accident.


      **Why +/-7 days.** A single calendar day's normal rests on ~30
      observations, one per reference year, and at that sample size sigma is
      noise. The window gives 15 calendar days x ~30 years = ~450 observations
      of a distribution that genuinely varies slowly across a fortnight. The
      window is circular: 1 January draws on 25 December through 8 January,
      and a non-circular one would build the year's first and last weeks from
      half the data, exactly where the northern winter extremes are.


      **Leap day.** Keyed on `month_day`, so 29 February is its own row rather
      than colliding with 1 March as it would under raw day_of_year. Its own
      sample is a quarter the size of other days - eight leap years in
      thirty-two - but its +/-7 window is full, drawn from 22 February to
      7 March in every year.


      A null sigma means no leakage-free baseline exists: the city has a single
      reference year, and excluding it leaves nothing. That is the honest
      answer rather than a silent fallback to the leaky value.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_id, month_day, for_year]
    columns:
      - name: city_id
        description: '{{ doc("col_city_id") }}'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cities')
                field: city_id
      - name: month_day
        description: MM-DD. The leap-stable climatology key.
        tests: [not_null]
      - name: climatology_day
        description: Day-of-year as it would be in a leap year, 1..366. The circular axis the window is measured on.
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 1, max_value: 366}
      - name: for_year
        description: The year this baseline is for, and the year excluded from it.
        tests: [not_null]
      - name: excludes_own_year
        description: Whether the leave-one-year-out exclusion was applied.
        tests: [not_null]
      - name: observations
        description: Observations in the baseline after the exclusion. Zero where none remain.
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0}
      - name: mean_temperature_2m_mean
        tests:
          - accepted_range:
              arguments: {min_value: -90, max_value: 60}
      - name: stddev_temperature_2m_mean
        description: >
          Within-window standard deviation - variability around the seasonal
          curve, not around the annual mean. Null only where the exclusion
          leaves no observations.
        tests:
          - accepted_range:
              arguments: {min_value: 0, max_value: 30}
      - name: city_id
        description: '{{ doc("col_city_id") }}'
      - name: reference_years
        description: >
          Distinct years contributing to the window.
      - name: excluded_observations
        description: >
          How many observations the exclusion removed. Zero at the edges of the record, where the labelled year contributed nothing to this window.
      - name: mean_temperature_2m_mean
        description: >
          Baseline mean daily temperature for this city and calendar day, excluding the labelled year.
      - name: mean_temperature_2m_max
        description: >
          Baseline mean of the daily maximum.
      - name: stddev_temperature_2m_max
        description: >
          Baseline standard deviation of the daily maximum.
      - name: mean_temperature_2m_min
        description: >
          Baseline mean of the daily minimum.
      - name: stddev_temperature_2m_min
        description: >
          Baseline standard deviation of the daily minimum.
      - name: observations_all_years
        description: >
          Observations in the window across every reference year, including the one being labelled.
      - name: mean_temperature_2m_mean_all_years
        description: >
          The published normal, including the labelled year. Carried for display and so the cost of the leakage is measurable rather than asserted.
      - name: stddev_temperature_2m_mean_all_years
        description: >
          The all-years standard deviation. See `mean_temperature_2m_mean_all_years`.

  - name: fact_weather_anomalies
    description: >
      Daily temperature anomalies as Z-scores against the leakage-safe
      baseline, with a flag on both tails.


      A separate model rather than columns on fact_weather_observations,
      because the climatology is built from that fact and feeding its output
      back would be a cycle.


      **Both tails.** A cold anomaly at Z < -2.5 is as much an extreme event as
      a heat anomaly. Writing `z > 2.5` reads naturally and silently discards
      half the signal - Phoenix would lose 125 of its 145 flagged days, and a
      warm-only project would report Moscow as one of the calmest cities in the
      set.


      **A null Z is not a quiet day.** Where the leave-one-year-out baseline
      has nothing left - a city with a single reference year - sigma is null,
      Z is null, and so are both flags. "Unknown" is the honest answer;
      coercing to `none` would assert the day was ordinary on no evidence and
      would put those days in the denominator of every anomaly rate.


      **Measured rate: 1.65% of scored city-days**, against 1.24% for a normal
      distribution and a plausible band of 0.5-3%. Hot 524, cold 452.


      Three per-city outliers, each investigated rather than accepted:
      Tokyo at 3.90% has a baseline of 45 observations rather than 455 because
      only four years have backfilled, and a sigma from 45 points is noisy -
      its sd(Z) is 1.14 where every complete city sits at 1.00. Cairo skews hot
      (208/25) because its residual distribution is the most right-skewed in
      the set at +0.59. Phoenix skews cold (20/125) because its is the only
      left-skewed one at -0.39: desert heat has a radiative ceiling while cold
      outbreaks are sharp.


      **A warming trend runs through every city** - corr(year, Z) is positive
      everywhere, from +0.05 in Delhi to +0.38 in Lagos. The baseline spans the
      whole reference period, so a trending series produces hot anomalies late
      and cold anomalies early. That is a real signal rather than an artefact,
      but it means the flag currently conflates "unusual for this day of year"
      with "warmer than the thirty-year mean because the climate has warmed" -
      a distinction ML-05 will need to make deliberately.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_id, date_key]
    columns:
      - name: city_id
        description: '{{ doc("col_city_id") }}'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cities')
                field: city_id
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: z_temperature_2m_mean
        description: >
          (observed - mu) / sigma against the leakage-safe baseline. Null where
          no such baseline exists.
        tests:
          - accepted_range:
              arguments: {min_value: -12, max_value: 12}
      - name: departure_c
        description: >
          The same departure in degrees. The Z-score answers "how unusual"; this
          answers "how much", and a dashboard needs both - 2.6 sigma is 1.8 °C
          in Singapore and 20 °C in Moscow.
      - name: anomaly_direction
        description: hot, cold, none - or null where the day could not be scored.
        tests:
          - accepted_values:
              arguments:
                values: ['hot', 'cold', 'none']
      - name: is_anomaly
        description: abs(z) over the threshold. Null where z is null.
      - name: city_id
        description: '{{ doc("col_city_id") }}'
      - name: date_key
        description: '{{ doc("col_date_key") }}'
      - name: month_day
        description: >
          MM-DD. The leap-stable climatology join key.
      - name: year
        description: >
          Calendar year of the observation, in UTC.
      - name: temperature_2m_mean
        description: '{{ doc("col_temperature_2m_mean") }}'
      - name: mean_temperature_2m_mean
        description: >
          Baseline mean daily temperature for this city and calendar day, excluding the labelled year.
      - name: stddev_temperature_2m_mean
        description: >
          Baseline standard deviation, excluding the labelled year. Null only where the exclusion leaves nothing.
      - name: baseline_observations
        description: >
          Observations behind the baseline this day was scored against.
      - name: excludes_own_year
        description: >
          Whether the baseline excluded the labelled year. Always true unless the leaky variant was built on purpose.
      - name: z_temperature_2m_max
        description: >
          Z-score of the daily maximum against its own baseline.
      - name: z_temperature_2m_min
        description: >
          Z-score of the daily minimum. Often the most anomalous of the three in a heat wave, since hot nights are its distinguishing feature.

