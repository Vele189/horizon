# Local development warehouse.
#
# This is where the 30-year backfill lands and where all dbt iteration happens.
# Neon receives only finished gold marts (§5.4 of docs/proposal.md) — running a
# multi-hour backfill against a serverless database is both slow and wasteful of
# the 100 compute-hours in the free allowance.
#
#   cp .env.example .env    # then set POSTGRES_PASSWORD
#   docker compose up -d
#
# Every value below comes from .env. Nothing is hardcoded, and .env is
# git-ignored.

services:
  postgres:
    image: postgres:16
    container_name: climate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-climate}
      POSTGRES_DB: ${POSTGRES_DB:-climate}
      # No default. Compose refuses to start rather than silently standing up a
      # warehouse with a blank or guessable password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set — copy .env.example to .env and set it}
      # The archive API returns local time by default; everything in this
      # project is stored and compared in UTC. Pinning the server timezone
      # means a missing AT TIME ZONE fails visibly rather than drifting by
      # the host's offset (§5.3).
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume, not a bind mount: `docker compose down` leaves it intact,
      # so a backfill measured in hours survives a restart. Removing it takes
      # the explicit `docker compose down -v`.
      - climate_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Dependent services (dbt, ingestion) gate on this via
      # `depends_on: {postgres: {condition: service_healthy}}`.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-climate} -d ${POSTGRES_DB:-climate}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  climate_pgdata:
    name: climate_pgdata
